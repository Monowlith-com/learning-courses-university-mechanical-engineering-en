<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Requirements and functional structure</title><desc id="desc">Functional structure of a lifting device with energy, material and signal flows.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Requirements and functional structure</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="280" y="180" width="400" height="235" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="225" font-size="30" fill="#172b3b" text-anchor="middle">Lifting device</text><text x="480" y="275" font-size="25" fill="#172b3b" text-anchor="middle">Supply energy</text><text x="480" y="320" font-size="25" fill="#172b3b" text-anchor="middle">Transmit force</text><text x="480" y="365" font-size="25" fill="#172b3b" text-anchor="middle">Hold load</text><line x1="75" y1="250" x2="280" y2="250" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="80" y="238" font-size="23" fill="#ad472f" text-anchor="start">Energy</text><line x1="75" y1="310" x2="280" y2="310" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="80" y="298" font-size="23" fill="#116b91" text-anchor="start">Load</text><line x1="75" y1="370" x2="280" y2="370" stroke="#64748b" stroke-width="4" marker-end="url(#arr)"/><text x="80" y="358" font-size="23" fill="#64748b" text-anchor="start">Signal</text><line x1="680" y1="310" x2="885" y2="310" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="885" y="290" font-size="22" fill="#116b91" text-anchor="end">Load lifted</text><text x="480" y="490" font-size="27" fill="#172b3b" text-anchor="middle">Requirement: travel ≥ 0.30 m</text></g></svg>
