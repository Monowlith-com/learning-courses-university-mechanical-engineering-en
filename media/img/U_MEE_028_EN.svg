<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Cycles and heat engines</title><desc id="desc">Heat engine with heat input, useful work and rejected heat.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Cycles and heat engines</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="300" y="115" width="360" height="70" fill="#f6ded5" stroke="#334155" stroke-width="2"/><text x="480" y="160" font-size="29" fill="#ad472f" text-anchor="middle">900 K</text><line x1="480" y1="185" x2="480" y2="250" stroke="#ad472f" stroke-width="6" marker-end="url(#arr)"/><text x="500" y="225" font-size="25" fill="#ad472f" text-anchor="start">QH = 600 kJ</text><rect x="330" y="250" width="300" height="100" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="310" font-size="30" fill="#172b3b" text-anchor="middle">Engine</text><line x1="630" y1="300" x2="860" y2="300" stroke="#116b91" stroke-width="6" marker-end="url(#arr)"/><text x="745" y="275" font-size="25" fill="#116b91" text-anchor="middle">W = 240 kJ</text><line x1="480" y1="350" x2="480" y2="435" stroke="#ad472f" stroke-width="6" marker-end="url(#arr)"/><text x="500" y="407" font-size="25" fill="#ad472f" text-anchor="start">QC = 360 kJ</text><rect x="300" y="435" width="360" height="70" fill="#dbeaf3" stroke="#334155" stroke-width="2"/><text x="480" y="480" font-size="29" fill="#116b91" text-anchor="middle">300 K</text><text x="480" y="550" font-size="28" fill="#172b3b" text-anchor="middle">η = 40 %  ·  ηC = 66.7 %</text></g></svg>
