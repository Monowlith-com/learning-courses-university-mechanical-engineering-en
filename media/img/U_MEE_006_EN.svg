<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Probability and statistics</title><desc id="desc">Five hypothetical diameter measurements around the mean of 20 mm.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Probability and statistics</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><line x1="120" y1="300" x2="840" y2="300" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="840" y="395" font-size="23" fill="#172b3b" text-anchor="end">d [mm]</text><line x1="180" y1="290" x2="180" y2="310" stroke="#334155" stroke-width="3"/><text x="180" y="350" font-size="22" fill="#172b3b" text-anchor="middle">19.98</text><circle cx="180" cy="265" r="10" fill="#116b91"/><line x1="330" y1="290" x2="330" y2="310" stroke="#334155" stroke-width="3"/><text x="330" y="350" font-size="22" fill="#172b3b" text-anchor="middle">19.99</text><circle cx="330" cy="265" r="10" fill="#116b91"/><line x1="480" y1="290" x2="480" y2="310" stroke="#334155" stroke-width="3"/><text x="480" y="350" font-size="22" fill="#172b3b" text-anchor="middle">20.00</text><circle cx="480" cy="265" r="10" fill="#116b91"/><line x1="630" y1="290" x2="630" y2="310" stroke="#334155" stroke-width="3"/><text x="630" y="350" font-size="22" fill="#172b3b" text-anchor="middle">20.01</text><circle cx="630" cy="265" r="10" fill="#116b91"/><line x1="780" y1="290" x2="780" y2="310" stroke="#334155" stroke-width="3"/><text x="780" y="350" font-size="22" fill="#172b3b" text-anchor="middle">20.02</text><circle cx="780" cy="265" r="10" fill="#116b91"/><line x1="480" y1="175" x2="480" y2="285" stroke="#116b91" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="155" font-size="28" fill="#116b91" text-anchor="middle">Mean = 20.00 mm</text><text x="480" y="460" font-size="26" fill="#172b3b" text-anchor="middle">Measurements are not tolerance limits</text></g></svg>
