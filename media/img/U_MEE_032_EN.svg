<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Continuity and Bernoulli equation</title><desc id="desc">Pipe contraction with area, velocity and static pressure.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Continuity and Bernoulli equation</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><polyline points="80,180 360,180 570,250 880,250" fill="none" stroke="#116b91" stroke-width="5"/><polyline points="80,420 360,420 570,350 880,350" fill="none" stroke="#116b91" stroke-width="5"/><line x1="120" y1="300" x2="300" y2="300" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><line x1="625" y1="300" x2="855" y2="300" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><text x="190" y="260" font-size="26" fill="#172b3b" text-anchor="middle">c₁ = 1 m/s</text><text x="740" y="225" font-size="26" fill="#172b3b" text-anchor="middle">c₂ = 2 m/s</text><text x="210" y="465" font-size="25" fill="#172b3b" text-anchor="middle">A₁ = 0.010 m²</text><text x="725" y="395" font-size="25" fill="#172b3b" text-anchor="middle">A₂ = 0.005 m²</text><text x="480" y="530" font-size="28" fill="#ad472f" text-anchor="middle">p₁ − p₂ = 1.5 kPa</text></g></svg>
