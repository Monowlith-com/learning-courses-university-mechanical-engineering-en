<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Torsion and combined loading</title><desc id="desc">Circular shaft with torque, radius, maximum shear stress and angle of twist.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Torsion and combined loading</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="180" y="245" width="530" height="110" fill="#eef2f5" stroke="#334155" stroke-width="2"/><ellipse cx="180" cy="300" rx="42" ry="55" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><ellipse cx="710" cy="300" rx="42" ry="55" fill="#e2e8f0" stroke="#334155" stroke-width="3"/><line x1="710" y1="300" x2="710" y2="245" stroke="#ad472f" stroke-width="3" marker-end="url(#arr)"/><text x="735" y="260" font-size="24" fill="#ad472f" text-anchor="start">r</text><text x="480" y="205" font-size="28" fill="#172b3b" text-anchor="middle">Circular cross-section</text><path d="M 730 175 Q 805 180 815 265" fill="none" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="815" y="175" font-size="30" fill="#ad472f" text-anchor="start">T</text><text x="480" y="420" font-size="30" fill="#116b91" text-anchor="middle">τmax = Tr/J</text><text x="480" y="475" font-size="30" fill="#172b3b" text-anchor="middle">φ = TL/(GJ)</text><text x="480" y="530" font-size="27" fill="#172b3b" text-anchor="middle">J = πd⁴/32</text></g></svg>
