<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Computational fluid dynamics</title><desc id="desc">Control volume with mass flows at inlet and outlet.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Computational fluid dynamics</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="315" y="175" width="330" height="285" fill="#dbeaf1" stroke="#334155" stroke-width="2"/><text x="480" y="280" font-size="27" fill="#172b3b" text-anchor="middle">Control volume</text><text x="480" y="340" font-size="26" fill="#172b3b" text-anchor="middle">dm/dt = 0.01 kg/s</text><line x1="75" y1="315" x2="315" y2="315" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><text x="190" y="290" font-size="27" fill="#116b91" text-anchor="middle">2.00 kg/s</text><line x1="645" y1="245" x2="885" y2="245" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="765" y="220" font-size="26" fill="#ad472f" text-anchor="middle">1.20 kg/s</text><line x1="645" y1="390" x2="885" y2="390" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="765" y="365" font-size="26" fill="#ad472f" text-anchor="middle">0.79 kg/s</text><text x="480" y="530" font-size="28" fill="#172b3b" text-anchor="middle">Steady imbalance: 0.5%</text></g></svg>
