<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Multibody simulation</title><desc id="desc">Planar two-link mechanism with joint angles q1 and q2.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Multibody simulation</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><line x1="180" y1="425" x2="480" y2="285" stroke="#116b91" stroke-width="22"/><line x1="480" y1="285" x2="750" y2="159" stroke="#116b91" stroke-width="22"/><circle cx="180" cy="425" r="16" fill="#475569"/><circle cx="480" cy="285" r="22" fill="#ad472f"/><circle cx="750" cy="159" r="22" fill="#ad472f"/><line x1="180" y1="425" x2="340" y2="425" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/><line x1="480" y1="285" x2="620" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/><text x="260" y="430" font-size="26" fill="#172b3b" text-anchor="start">q₁</text><text x="575" y="302" font-size="26" fill="#172b3b" text-anchor="start">q₂ = 0</text><text x="480" y="245" font-size="28" fill="#172b3b" text-anchor="middle">m₁</text><text x="750" y="119" font-size="28" fill="#172b3b" text-anchor="middle">m₂</text><text x="325" y="315" font-size="26" fill="#172b3b" text-anchor="start">l₁</text><text x="620" y="190" font-size="26" fill="#172b3b" text-anchor="start">l₂</text><text x="480" y="510" font-size="26" fill="#172b3b" text-anchor="middle">Shown: extended configuration, q₂ = 0</text><text x="480" y="555" font-size="27" fill="#172b3b" text-anchor="middle">q̈ = (1, −2) rad/s²</text></g></svg>
