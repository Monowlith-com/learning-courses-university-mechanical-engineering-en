<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Bachelor project: mechanical system</title><desc id="desc">Cantilever with test load and two calculated acceptance criteria.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Bachelor project: mechanical system</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="120" y="150" width="60" height="200" fill="#64748b" stroke="#334155" stroke-width="2"/><rect x="180" y="230" width="600" height="35" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><line x1="780" y1="130" x2="780" y2="230" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="790" y="150" font-size="24" fill="#ad472f" text-anchor="start">F = 100 N</text><line x1="180" y1="390" x2="780" y2="390" stroke="#334155" stroke-width="3"/><line x1="180" y1="375" x2="180" y2="405" stroke="#334155" stroke-width="3"/><line x1="780" y1="375" x2="780" y2="405" stroke="#334155" stroke-width="3"/><text x="480" y="430" font-size="25" fill="#172b3b" text-anchor="middle">L = 300 mm</text><polyline points="180,247 330,253 480,267 630,291 780,325" fill="none" stroke="#116b91" stroke-width="4"/><text x="480" y="470" font-size="22" fill="#172b3b" text-anchor="middle">Deflection exaggerated</text><text x="480" y="510" font-size="27" fill="#116b91" text-anchor="middle">B: σ = 22.5 MPa   ·   δ = 0.3375 mm</text><text x="480" y="550" font-size="26" fill="#172b3b" text-anchor="middle">σ ≤ 80 MPa   ·   δ ≤ 1 mm</text></g></svg>
