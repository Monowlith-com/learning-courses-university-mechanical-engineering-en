<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Exergy and irreversible processes</title><desc id="desc">Exergy of heat at two temperature levels relative to the environment.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Exergy and irreversible processes</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="145" font-size="30" fill="#172b3b" text-anchor="middle">Q = 100 kJ · T₀ = 300 K</text><rect x="190" y="220" width="230" height="200" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="190" y="320" width="230" height="100" fill="#116b91" stroke="#334155" stroke-width="2"/><rect x="540" y="220" width="230" height="200" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="540" y="370" width="230" height="50" fill="#116b91" stroke="#334155" stroke-width="2"/><text x="305" y="385" font-size="26" fill="#ffffff" text-anchor="middle">50 kJ</text><text x="655" y="403" font-size="25" fill="#ffffff" text-anchor="middle">25 kJ</text><text x="305" y="465" font-size="30" fill="#172b3b" text-anchor="middle">600 K</text><text x="655" y="465" font-size="30" fill="#172b3b" text-anchor="middle">400 K</text><text x="480" y="535" font-size="27" fill="#172b3b" text-anchor="middle">Blue: exergy of heat</text></g></svg>
