<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Newtonian equations of motion</title><desc id="desc">Force balance on a horizontal carriage.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Newtonian equations of motion</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="350" y="230" width="260" height="140" fill="#eef2f5" stroke="#334155" stroke-width="2"/><text x="480" y="310" font-size="29" fill="#172b3b" text-anchor="middle">m = 20 kg</text><line x1="610" y1="300" x2="830" y2="300" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><text x="720" y="275" font-size="27" fill="#116b91" text-anchor="middle">100 N</text><line x1="350" y1="300" x2="210" y2="300" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="280" y="275" font-size="27" fill="#ad472f" text-anchor="middle">30 N</text><line x1="480" y1="230" x2="480" y2="120" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="500" y="145" font-size="26" fill="#172b3b" text-anchor="start">N</text><line x1="480" y1="370" x2="480" y2="480" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="500" y="465" font-size="26" fill="#172b3b" text-anchor="start">mg</text><text x="480" y="540" font-size="30" fill="#116b91" text-anchor="middle">a = 3.5 m/s²</text></g></svg>
