<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Rigid bodies and rotation</title><desc id="desc">Torque at the rim of a fixed-axis disk.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Rigid bodies and rotation</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><circle cx="410" cy="325" r="160" fill="#e2e8f0" stroke="#116b91" stroke-width="4"/><circle cx="410" cy="325" r="10" fill="#116b91"/><line x1="410" y1="325" x2="570" y2="325" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="490" y="305" font-size="27" fill="#172b3b" text-anchor="start">r</text><line x1="570" y1="325" x2="570" y2="140" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="590" y="155" font-size="30" fill="#ad472f" text-anchor="start">F</text><text x="700" y="245" font-size="28" fill="#116b91" text-anchor="start">M = rF</text><text x="700" y="300" font-size="28" fill="#172b3b" text-anchor="start">I = mr²/2</text><text x="700" y="355" font-size="28" fill="#172b3b" text-anchor="start">M = Iα</text><text x="410" y="535" font-size="28" fill="#172b3b" text-anchor="middle">Fixed axis</text></g></svg>
