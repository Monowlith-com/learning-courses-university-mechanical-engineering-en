<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Differential and integral calculus</title><desc id="desc">Velocity-time diagram with linear velocity and triangular displacement area.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Differential and integral calculus</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><line x1="140" y1="470" x2="840" y2="470" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="140" y1="470" x2="140" y2="130" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="835" y="505" font-size="22" fill="#172b3b" text-anchor="end">t [s]</text><text x="152" y="142" font-size="22" fill="#172b3b" text-anchor="start">v [m/s]</text><polyline points="140,470 740,170 740,470 140,470" fill="#e1f0f5" stroke="#116b91" stroke-width="4"/><line x1="740" y1="170" x2="740" y2="470" stroke="#116b91" stroke-width="2" stroke-dasharray="8 6"/><text x="740" y="500" font-size="24" fill="#172b3b" text-anchor="middle">3</text><text x="85" y="178" font-size="24" fill="#172b3b" text-anchor="start">6</text><line x1="140" y1="170" x2="740" y2="170" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="455" y="402" font-size="30" fill="#116b91" text-anchor="middle">Area = 9 m</text><text x="540" y="240" font-size="26" fill="#116b91" text-anchor="start">v = 2t</text><text x="460" y="550" font-size="27" fill="#172b3b" text-anchor="middle">Slope: a = 2 m/s²</text></g></svg>
