<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Vectors and forces</title><desc id="desc">A 500 N force resolved into orthogonal components of 400 N and 300 N.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Vectors and forces</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><line x1="180" y1="480" x2="830" y2="480" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="180" y1="480" x2="180" y2="125" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="825" y="515" font-size="22" fill="#172b3b" text-anchor="end">x [N]</text><text x="192" y="137" font-size="22" fill="#172b3b" text-anchor="start">y [N]</text><line x1="180" y1="480" x2="660" y2="120" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><line x1="180" y1="480" x2="660" y2="480" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><line x1="660" y1="480" x2="660" y2="120" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><line x1="180" y1="120" x2="660" y2="120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/><text x="420" y="310" font-size="29" fill="#116b91" text-anchor="start">F = 500 N</text><text x="420" y="525" font-size="26" fill="#ad472f" text-anchor="middle">Fₓ = 400 N</text><text x="685" y="310" font-size="26" fill="#ad472f" text-anchor="start">Fᵧ = 300 N</text><text x="205" y="445" font-size="22" fill="#172b3b" text-anchor="start">θ ≈ 36.87°</text></g></svg>
