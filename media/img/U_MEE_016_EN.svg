<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Work, energy and momentum</title><desc id="desc">Momentum balance of two carts before and after an inelastic collision.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Work, energy and momentum</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="145" font-size="27" fill="#172b3b" text-anchor="start">Before collision</text><rect x="100" y="190" width="160" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><rect x="620" y="190" width="240" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><text x="180" y="245" font-size="27" fill="#172b3b" text-anchor="middle">2 kg</text><text x="740" y="245" font-size="27" fill="#172b3b" text-anchor="middle">4 kg</text><line x1="260" y1="235" x2="480" y2="235" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="370" y="210" font-size="25" fill="#172b3b" text-anchor="middle">3 m/s</text><text x="80" y="345" font-size="27" fill="#172b3b" text-anchor="start">After collision</text><rect x="100" y="385" width="160" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><rect x="260" y="385" width="240" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><text x="300" y="440" font-size="27" fill="#172b3b" text-anchor="middle">6 kg</text><line x1="500" y1="430" x2="670" y2="430" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="585" y="405" font-size="25" fill="#172b3b" text-anchor="middle">1 m/s</text><text x="480" y="540" font-size="28" fill="#172b3b" text-anchor="middle">p = 6 kg·m/s</text></g></svg>
