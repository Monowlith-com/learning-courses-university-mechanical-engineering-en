<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Combustion and low-emission systems</title><desc id="desc">Stoichiometric methane balance showing reactant and product masses; no burner design.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Combustion and low-emission systems</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="70" y="230" width="185" height="155" fill="#e0eef3" stroke="#334155" stroke-width="2"/><text x="162.5" y="283" font-size="32" fill="#172b3b" text-anchor="middle">CH₄</text><text x="162.5" y="345" font-size="29" fill="#172b3b" text-anchor="middle">1 kg</text><rect x="285" y="230" width="185" height="155" fill="#e0eef3" stroke="#334155" stroke-width="2"/><text x="377.5" y="283" font-size="32" fill="#172b3b" text-anchor="middle">2 O₂</text><text x="377.5" y="345" font-size="29" fill="#172b3b" text-anchor="middle">4 kg</text><rect x="515" y="230" width="185" height="155" fill="#e4ece2" stroke="#334155" stroke-width="2"/><text x="607.5" y="283" font-size="32" fill="#172b3b" text-anchor="middle">CO₂</text><text x="607.5" y="345" font-size="29" fill="#172b3b" text-anchor="middle">2.75 kg</text><rect x="730" y="230" width="160" height="155" fill="#e4ece2" stroke="#334155" stroke-width="2"/><text x="810.0" y="283" font-size="32" fill="#172b3b" text-anchor="middle">2 H₂O</text><text x="810.0" y="345" font-size="29" fill="#172b3b" text-anchor="middle">2.25 kg</text><text x="270" y="316" font-size="29" fill="#172b3b" text-anchor="middle">+</text><line x1="472" y1="307" x2="510" y2="307" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="715" y="316" font-size="29" fill="#172b3b" text-anchor="middle">+</text><text x="480" y="150" font-size="29" fill="#172b3b" text-anchor="middle">Complete oxidation (ideal balance)</text><text x="480" y="460" font-size="32" fill="#172b3b" text-anchor="middle">5 kg = 5 kg</text><text x="480" y="525" font-size="26" fill="#172b3b" text-anchor="middle">Air nitrogen omitted</text></g></svg>
