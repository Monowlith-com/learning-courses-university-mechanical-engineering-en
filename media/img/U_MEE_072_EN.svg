<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Automated manufacturing and robot interfaces</title><desc id="desc">Timeline of a model robot cycle with sequential process stages.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Automated manufacturing and robot interfaces</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="65" y="220" width="130" height="115" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="130.0" y="265" font-size="23" fill="#172b3b" text-anchor="middle">Feed</text><text x="130.0" y="310" font-size="27" fill="#172b3b" text-anchor="middle">2 s</text><rect x="195" y="220" width="195" height="115" fill="#d0e5ee" stroke="#334155" stroke-width="2"/><text x="292.5" y="265" font-size="23" fill="#172b3b" text-anchor="middle">Transfer</text><text x="292.5" y="310" font-size="27" fill="#172b3b" text-anchor="middle">3 s</text><rect x="390" y="220" width="390" height="115" fill="#b9d5e3" stroke="#334155" stroke-width="2"/><text x="585.0" y="265" font-size="23" fill="#172b3b" text-anchor="middle">Process</text><text x="585.0" y="310" font-size="27" fill="#172b3b" text-anchor="middle">6 s</text><rect x="780" y="220" width="65" height="115" fill="#f0ded7" stroke="#334155" stroke-width="2"/><text x="812.5" y="205" font-size="23" fill="#172b3b" text-anchor="middle">Unload</text><text x="812.5" y="310" font-size="27" fill="#172b3b" text-anchor="middle">1 s</text><line x1="65" y1="335" x2="65" y2="355" stroke="#334155" stroke-width="3"/><text x="65" y="390" font-size="23" fill="#172b3b" text-anchor="middle">0</text><line x1="195" y1="335" x2="195" y2="355" stroke="#334155" stroke-width="3"/><text x="195" y="390" font-size="23" fill="#172b3b" text-anchor="middle">2</text><line x1="390" y1="335" x2="390" y2="355" stroke="#334155" stroke-width="3"/><text x="390" y="390" font-size="23" fill="#172b3b" text-anchor="middle">5</text><line x1="780" y1="335" x2="780" y2="355" stroke="#334155" stroke-width="3"/><text x="780" y="390" font-size="23" fill="#172b3b" text-anchor="middle">11</text><line x1="845" y1="335" x2="845" y2="355" stroke="#334155" stroke-width="3"/><text x="845" y="390" font-size="23" fill="#172b3b" text-anchor="middle">12</text><text x="480" y="150" font-size="28" fill="#172b3b" text-anchor="middle">Sequential cycle</text><text x="480" y="465" font-size="29" fill="#172b3b" text-anchor="middle">T = 12 s · 300 parts/h</text><text x="480" y="530" font-size="27" fill="#172b3b" text-anchor="middle">90% available time → 270 parts/h</text></g></svg>
