<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Systems, state variables and property models</title><desc id="desc">Piston-cylinder system with state variables and system boundary.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Systems, state variables and property models</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="235" y="180" width="460" height="300" fill="#e1f0f5" stroke="#334155" stroke-width="2"/><rect x="235" y="175" width="460" height="35" fill="#94a3b8" stroke="#334155" stroke-width="2"/><rect x="445" y="110" width="40" height="65" fill="#94a3b8" stroke="#334155" stroke-width="2"/><line x1="465" y1="115" x2="465" y2="170" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="465" y="270" font-size="30" fill="#172b3b" text-anchor="middle">m = 0.5 kg</text><text x="465" y="320" font-size="30" fill="#172b3b" text-anchor="middle">T = 300 K</text><text x="465" y="370" font-size="30" fill="#172b3b" text-anchor="middle">V = 0.2 m³</text><text x="465" y="420" font-size="30" fill="#116b91" text-anchor="middle">p = 215.25 kPa</text><polyline points="215,155 715,155 715,500 215,500 215,155" fill="none" stroke="#116b91" stroke-width="2"/><text x="465" y="545" font-size="27" fill="#172b3b" text-anchor="middle">Closed system</text></g></svg>
