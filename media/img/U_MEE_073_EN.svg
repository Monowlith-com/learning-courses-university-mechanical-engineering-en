<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Digital twins and industrial data</title><desc id="desc">Data flow from machine through timestamp and model to monitored residual.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Digital twins and industrial data</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="55" y="170" width="230" height="115" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="170" y="212" font-size="29" fill="#172b3b" text-anchor="middle">Machine</text><text x="170" y="251" font-size="23" fill="#172b3b" text-anchor="middle">Measurements</text><line x1="285" y1="228" x2="365" y2="228" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><rect x="365" y="170" width="230" height="115" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="212" font-size="29" fill="#172b3b" text-anchor="middle">Data</text><text x="480" y="251" font-size="23" fill="#172b3b" text-anchor="middle">Time + unit</text><line x1="595" y1="228" x2="675" y2="228" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><rect x="675" y="170" width="230" height="115" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="790" y="212" font-size="29" fill="#172b3b" text-anchor="middle">Model</text><text x="790" y="251" font-size="23" fill="#172b3b" text-anchor="middle">Prediction</text><line x1="170" y1="285" x2="170" y2="360" stroke="#116b91" stroke-width="3"/><line x1="790" y1="285" x2="790" y2="360" stroke="#ad472f" stroke-width="3"/><line x1="170" y1="360" x2="370" y2="360" stroke="#116b91" stroke-width="3" marker-end="url(#arr)"/><line x1="790" y1="360" x2="590" y2="360" stroke="#ad472f" stroke-width="3" marker-end="url(#arr)"/><rect x="370" y="325" width="220" height="75" fill="#e6efdf" stroke="#334155" stroke-width="2"/><text x="480" y="373" font-size="28" fill="#172b3b" text-anchor="middle">Residual</text><text x="480" y="470" font-size="30" fill="#172b3b" text-anchor="middle">e = [1, −1, 2] K</text><text x="480" y="530" font-size="30" fill="#172b3b" text-anchor="middle">RMSE = 1.414 K</text></g></svg>
