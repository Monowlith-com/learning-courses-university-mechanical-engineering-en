<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Support reactions and trusses</title><desc id="desc">Symmetric triangular truss with compression diagonals, tension bottom chord and vertical apex load.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Support reactions and trusses</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><polyline points="200,360 480,150 760,360 200,360" fill="none" stroke="#116b91" stroke-width="6"/><line x1="480" y1="105" x2="480" y2="150" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="500" y="125" font-size="26" fill="#ad472f" text-anchor="start">F = 6 kN</text><text x="157" y="395" font-size="27" fill="#172b3b" text-anchor="start">A</text><text x="780" y="395" font-size="27" fill="#172b3b" text-anchor="start">B</text><text x="455" y="145" font-size="24" fill="#172b3b" text-anchor="end">C</text><line x1="200" y1="465" x2="200" y2="360" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><line x1="760" y1="465" x2="760" y2="360" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="155" y="490" font-size="24" fill="#172b3b" text-anchor="start">3 kN</text><text x="700" y="490" font-size="24" fill="#172b3b" text-anchor="start">3 kN</text><text x="300" y="225" font-size="24" fill="#116b91" text-anchor="start">5 kN</text><text x="625" y="245" font-size="24" fill="#116b91" text-anchor="start">5 kN</text><text x="480" y="400" font-size="24" fill="#116b91" text-anchor="middle">4 kN</text><text x="480" y="545" font-size="25" fill="#172b3b" text-anchor="middle">Diagonals: compression · bottom chord: tension</text></g></svg>
