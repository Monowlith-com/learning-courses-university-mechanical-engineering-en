<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Internal forces and shear</title><desc id="desc">Simply supported beam with central point load, stepped shear force and triangular bending moment.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Internal forces and shear</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="180" y="235" width="600" height="24" fill="#eef2f5" stroke="#334155" stroke-width="2"/><line x1="480" y1="120" x2="480" y2="235" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="494" y="140" font-size="25" fill="#ad472f" text-anchor="start">F = 6 kN</text><polyline points="155,292 180,259 205,292 155,292" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><line x1="145" y1="298" x2="215" y2="298" stroke="#334155" stroke-width="3"/><line x1="180" y1="365" x2="180" y2="270" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="180" y="395" font-size="25" fill="#116b91" text-anchor="middle">A · 3 kN</text><polyline points="755,292 780,259 805,292 755,292" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><line x1="745" y1="298" x2="815" y2="298" stroke="#334155" stroke-width="3"/><line x1="780" y1="365" x2="780" y2="270" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="780" y="395" font-size="25" fill="#116b91" text-anchor="middle">B · 3 kN</text><line x1="180" y1="440" x2="780" y2="440" stroke="#334155" stroke-width="3"/><polyline points="180,410 480,410 480,470 780,470" fill="none" stroke="#116b91" stroke-width="4"/><text x="95" y="445" font-size="21" fill="#172b3b" text-anchor="start">V [kN]</text><text x="310" y="400" font-size="20" fill="#172b3b" text-anchor="start">+3</text><text x="700" y="495" font-size="20" fill="#172b3b" text-anchor="start">−3</text><line x1="180" y1="545" x2="780" y2="545" stroke="#334155" stroke-width="3"/><polyline points="180,545 480,490 780,545" fill="none" stroke="#ad472f" stroke-width="4"/><text x="70" y="550" font-size="20" fill="#172b3b" text-anchor="start">M [kN·m]</text><text x="490" y="510" font-size="20" fill="#ad472f" text-anchor="start">6</text></g></svg>
