<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Biomedical and microsystems engineering</title><desc id="desc">Idealised microchannel with pressure difference, radius and volume flow.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Biomedical and microsystems engineering</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="190" y="190" width="580" height="180" fill="#dceaf1" stroke="#334155" stroke-width="2"/><line x1="90" y1="280" x2="180" y2="280" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><line x1="780" y1="280" x2="880" y2="280" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="100" y="245" font-size="28" fill="#172b3b" text-anchor="start">p₁</text><text x="835" y="245" font-size="28" fill="#172b3b" text-anchor="start">p₂</text><line x1="480" y1="280" x2="480" y2="190" stroke="#ad472f" stroke-width="3" marker-end="url(#arr)"/><text x="495" y="230" font-size="26" fill="#ad472f" text-anchor="start">r</text><line x1="190" y1="405" x2="770" y2="405" stroke="#334155" stroke-width="3"/><line x1="190" y1="390" x2="190" y2="420" stroke="#334155" stroke-width="3"/><line x1="770" y1="390" x2="770" y2="420" stroke="#334155" stroke-width="3"/><text x="480" y="440" font-size="26" fill="#172b3b" text-anchor="middle">l = 20 mm</text><text x="480" y="145" font-size="27" fill="#172b3b" text-anchor="middle">Δp = 1000 Pa</text><text x="480" y="505" font-size="32" fill="#116b91" text-anchor="middle">Q = 7.36 µL/min</text><text x="480" y="550" font-size="28" fill="#172b3b" text-anchor="middle">Q proportional to r⁴</text></g></svg>
