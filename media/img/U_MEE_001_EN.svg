<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Units, scaling and dimensional analysis</title><desc id="desc">Conversion of force and area with resulting normal stress.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Units, scaling and dimensional analysis</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="90" y="150" width="210" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><rect x="375" y="150" width="210" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><rect x="660" y="150" width="210" height="90" fill="#eef2f5" stroke="#334155" stroke-width="2"/><text x="195" y="205" font-size="28" fill="#172b3b" text-anchor="middle">F = 2 kN</text><text x="480" y="205" font-size="28" fill="#172b3b" text-anchor="middle">F = 2000 N</text><text x="765" y="205" font-size="24" fill="#172b3b" text-anchor="middle">2000 kg·m/s²</text><line x1="300" y1="195" x2="375" y2="195" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="585" y1="195" x2="660" y2="195" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="480" y="300" font-size="30" fill="#172b3b" text-anchor="middle">Force: [F] = M·L·T⁻²</text><rect x="150" y="365" width="660" height="110" fill="#fff" stroke="#334155" stroke-width="2"/><text x="480" y="410" font-size="28" fill="#172b3b" text-anchor="middle">Area: 100 mm² = 10⁻⁴ m²</text><text x="480" y="450" font-size="26" fill="#172b3b" text-anchor="middle">σ = 2000 N / 10⁻⁴ m² = 20 MPa</text></g></svg>
