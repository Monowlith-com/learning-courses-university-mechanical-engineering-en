<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Refrigeration and heat pumps</title><desc id="desc">Refrigeration loop with compressor, condenser, throttle and evaporator.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Refrigeration and heat pumps</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="325" y="130" width="310" height="65" fill="#f6ded5" stroke="#334155" stroke-width="2"/><text x="480" y="172" font-size="27" fill="#172b3b" text-anchor="middle">Condenser</text><rect x="690" y="270" width="190" height="65" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="785" y="310" font-size="25" fill="#172b3b" text-anchor="middle">Throttle</text><rect x="325" y="420" width="310" height="65" fill="#dbeaf3" stroke="#334155" stroke-width="2"/><text x="480" y="462" font-size="27" fill="#172b3b" text-anchor="middle">Evaporator</text><rect x="80" y="270" width="190" height="65" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="175" y="310" font-size="24" fill="#172b3b" text-anchor="middle">Compressor</text><polyline points="175,270 175,162 325,162" fill="none" stroke="#ad472f" stroke-width="4"/><line x1="300" y1="162" x2="325" y2="162" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><polyline points="635,162 785,162 785,270" fill="none" stroke="#ad472f" stroke-width="4"/><line x1="785" y1="245" x2="785" y2="270" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><polyline points="785,335 785,452 635,452" fill="none" stroke="#116b91" stroke-width="4"/><line x1="660" y1="452" x2="635" y2="452" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><polyline points="325,452 175,452 175,335" fill="none" stroke="#116b91" stroke-width="4"/><line x1="175" y1="360" x2="175" y2="335" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><line x1="480" y1="130" x2="480" y2="95" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="510" y="115" font-size="23" fill="#ad472f" text-anchor="start">QH = 8 kW</text><line x1="480" y1="530" x2="480" y2="485" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="510" y="530" font-size="23" fill="#116b91" text-anchor="start">QC = 6 kW</text><line x1="35" y1="302" x2="80" y2="302" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="85" y="255" font-size="22" fill="#ad472f" text-anchor="start">W = 2 kW</text></g></svg>
