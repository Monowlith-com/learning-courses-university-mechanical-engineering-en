<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Bending and deflection</title><desc id="desc">Cantilever beam with an end load and exaggerated deflection.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Bending and deflection</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="150" y="160" width="45" height="220" fill="#aeb9c3" stroke="#334155" stroke-width="2"/><rect x="195" y="240" width="580" height="25" fill="#eef2f5" stroke="#334155" stroke-width="2"/><line x1="775" y1="140" x2="775" y2="240" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="790" y="155" font-size="27" fill="#ad472f" text-anchor="start">F</text><polyline points="195,252 310,254 425,265 540,288 655,325 775,365" fill="none" stroke="#116b91" stroke-width="4"/><line x1="775" y1="265" x2="775" y2="365" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/><text x="800" y="320" font-size="30" fill="#116b91" text-anchor="start">δ</text><text x="480" y="420" font-size="25" fill="#172b3b" text-anchor="middle">Deflection exaggerated</text><text x="480" y="478" font-size="30" fill="#116b91" text-anchor="middle">δ = FL³/(3EI)</text><text x="480" y="530" font-size="29" fill="#172b3b" text-anchor="middle">σmax = FLc/I</text></g></svg>
