<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Aerospace foundations</title><desc id="desc">Forces in steady level flight and comparison of lift and drag.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Aerospace foundations</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><polyline points="300,300 400,250 580,270 660,300 580,330 400,340 300,300" fill="#dceaf1" stroke="#116b91" stroke-width="3"/><line x1="480" y1="250" x2="480" y2="125" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><line x1="480" y1="340" x2="480" y2="460" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><line x1="660" y1="300" x2="855" y2="300" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><line x1="300" y1="300" x2="105" y2="300" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="480" y="115" font-size="26" fill="#172b3b" text-anchor="middle">Lift L</text><text x="480" y="495" font-size="26" fill="#172b3b" text-anchor="middle">Weight mg</text><text x="785" y="270" font-size="26" fill="#172b3b" text-anchor="middle">Thrust T</text><text x="175" y="270" font-size="26" fill="#172b3b" text-anchor="middle">Drag D</text><text x="480" y="550" font-size="28" fill="#172b3b" text-anchor="middle">L = 12 kN   ·   D = 600 N   ·   L/D = 20</text></g></svg>
