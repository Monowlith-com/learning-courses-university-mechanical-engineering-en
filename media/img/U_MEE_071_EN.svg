<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Sustainable energy conversion and integration</title><desc id="desc">Energy balance of combined heat and power showing useful heat, electricity and losses.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Sustainable energy conversion and integration</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="310" y="190" width="270" height="220" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="445" y="280" font-size="38" fill="#172b3b" text-anchor="middle">CHP</text><line x1="65" y1="300" x2="310" y2="300" stroke="#116b91" stroke-width="8" marker-end="url(#arr)"/><text x="175" y="270" font-size="28" fill="#116b91" text-anchor="middle">100 kW</text><line x1="580" y1="220" x2="850" y2="220" stroke="#116b91" stroke-width="6" marker-end="url(#arr)"/><text x="715" y="208" font-size="22" fill="#116b91" text-anchor="middle">35 kW · Electricity</text><line x1="580" y1="300" x2="850" y2="300" stroke="#28764e" stroke-width="6" marker-end="url(#arr)"/><text x="715" y="288" font-size="22" fill="#28764e" text-anchor="middle">45 kW · Useful heat</text><line x1="580" y1="380" x2="850" y2="380" stroke="#ad472f" stroke-width="6" marker-end="url(#arr)"/><text x="715" y="368" font-size="22" fill="#ad472f" text-anchor="middle">20 kW · Losses</text><text x="480" y="510" font-size="34" fill="#172b3b" text-anchor="middle">η = 80 %</text><text x="480" y="555" font-size="25" fill="#172b3b" text-anchor="middle">Hypothetical plant</text></g></svg>
