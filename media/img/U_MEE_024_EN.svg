<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Materials selection</title><desc id="desc">Comparison of density and elastic modulus for two model materials.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Materials selection</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="140" font-size="28" fill="#172b3b" text-anchor="middle">Mass at equal tensile stiffness</text><line x1="140" y1="460" x2="840" y2="460" stroke="#334155" stroke-width="3"/><rect x="260" y="218.85" width="170" height="241.15" fill="#116b91" stroke="#334155" stroke-width="2"/><rect x="550" y="209.1" width="170" height="250.9" fill="#ad472f" stroke="#334155" stroke-width="2"/><text x="345" y="195" font-size="26" fill="#172b3b" text-anchor="middle">0.371 kg</text><text x="635" y="185" font-size="26" fill="#172b3b" text-anchor="middle">0.386 kg</text><text x="345" y="500" font-size="26" fill="#172b3b" text-anchor="middle">Steel</text><text x="635" y="500" font-size="26" fill="#172b3b" text-anchor="middle">Aluminium</text><text x="480" y="550" font-size="23" fill="#172b3b" text-anchor="middle">Model values, not supplier data</text></g></svg>
