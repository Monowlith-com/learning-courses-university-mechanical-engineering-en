<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Entropy and second law</title><desc id="desc">Heat flow from a hot to a cold reservoir and entropy generation.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Entropy and second law</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="100" y="185" width="270" height="180" fill="#f6ded5" stroke="#334155" stroke-width="2"/><rect x="590" y="185" width="270" height="180" fill="#dbeaf3" stroke="#334155" stroke-width="2"/><text x="235" y="240" font-size="32" fill="#ad472f" text-anchor="middle">500 K</text><text x="725" y="240" font-size="32" fill="#116b91" text-anchor="middle">300 K</text><text x="235" y="310" font-size="22" fill="#172b3b" text-anchor="middle">ΔS = −0.200 kJ/K</text><text x="725" y="310" font-size="22" fill="#172b3b" text-anchor="middle">ΔS = +0.333 kJ/K</text><line x1="370" y1="270" x2="590" y2="270" stroke="#ad472f" stroke-width="6" marker-end="url(#arr)"/><text x="480" y="245" font-size="24" fill="#ad472f" text-anchor="middle">100 kJ</text><text x="480" y="460" font-size="31" fill="#172b3b" text-anchor="middle">Sgen = 0.133 kJ/K &gt; 0</text></g></svg>
