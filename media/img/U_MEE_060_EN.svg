<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Finite element method</title><desc id="desc">Two axial bar elements with three nodes, a fixed support and end force.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Finite element method</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="90" y="190" width="35" height="145" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="125" y="268" width="325" height="45" fill="#dbeaf1" stroke="#334155" stroke-width="2"/><rect x="450" y="268" width="325" height="45" fill="#b4d4e2" stroke="#334155" stroke-width="2"/><line x1="775" y1="290" x2="895" y2="290" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="850" y="265" font-size="25" fill="#ad472f" text-anchor="middle">1000 N</text><circle cx="125" cy="290" r="8" fill="#116b91"/><text x="125" y="175" font-size="28" fill="#172b3b" text-anchor="middle">1</text><circle cx="450" cy="290" r="8" fill="#116b91"/><text x="450" y="240" font-size="28" fill="#172b3b" text-anchor="middle">2</text><circle cx="775" cy="290" r="8" fill="#116b91"/><text x="775" y="240" font-size="28" fill="#172b3b" text-anchor="middle">3</text><text x="125" y="365" font-size="24" fill="#172b3b" text-anchor="middle">0 mm</text><text x="450" y="365" font-size="24" fill="#172b3b" text-anchor="middle">0.025 mm</text><text x="775" y="365" font-size="24" fill="#172b3b" text-anchor="middle">0.050 mm</text><text x="287" y="410" font-size="25" fill="#172b3b" text-anchor="middle">L = 500 mm</text><text x="612" y="410" font-size="25" fill="#172b3b" text-anchor="middle">L = 500 mm</text><text x="480" y="510" font-size="26" fill="#172b3b" text-anchor="middle">Stress in both elements: 10 MPa</text></g></svg>
