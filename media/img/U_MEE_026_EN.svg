<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">First law and energy balances</title><desc id="desc">Energy balance of a system and a turbine with throughflow.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">First law and energy balances</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="300" y="200" width="360" height="205" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="265" font-size="32" fill="#172b3b" text-anchor="middle">Turbine</text><text x="480" y="315" font-size="26" fill="#172b3b" text-anchor="middle">ṁ = 2 kg/s</text><line x1="75" y1="305" x2="300" y2="305" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><text x="85" y="275" font-size="23" fill="#116b91" text-anchor="start">h₁ = 3200 kJ/kg</text><line x1="660" y1="305" x2="880" y2="305" stroke="#116b91" stroke-width="5" marker-end="url(#arr)"/><text x="680" y="275" font-size="23" fill="#116b91" text-anchor="start">h₂ = 2800 kJ/kg</text><line x1="480" y1="405" x2="480" y2="500" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="500" y="480" font-size="26" fill="#ad472f" text-anchor="start">Ẇ = 800 kW</text><text x="480" y="550" font-size="28" fill="#172b3b" text-anchor="middle">Q̇ = 0</text></g></svg>
