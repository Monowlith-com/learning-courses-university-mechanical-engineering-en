<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Free-body diagrams and equilibrium</title><desc id="desc">Free-body diagram of a beam with a 9 kN point load and vertical reactions of 6 and 3 kN.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Free-body diagrams and equilibrium</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="180" y="235" width="600" height="24" fill="#eef2f5" stroke="#334155" stroke-width="2"/><line x1="380" y1="120" x2="380" y2="235" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="394" y="140" font-size="25" fill="#ad472f" text-anchor="start">F = 9 kN</text><polyline points="155,292 180,259 205,292 155,292" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><line x1="145" y1="298" x2="215" y2="298" stroke="#334155" stroke-width="3"/><line x1="180" y1="365" x2="180" y2="270" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="180" y="395" font-size="25" fill="#116b91" text-anchor="middle">A · 6 kN</text><polyline points="755,292 780,259 805,292 755,292" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><line x1="745" y1="298" x2="815" y2="298" stroke="#334155" stroke-width="3"/><line x1="780" y1="365" x2="780" y2="270" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><text x="780" y="395" font-size="25" fill="#116b91" text-anchor="middle">B · 3 kN</text><line x1="180" y1="445" x2="380" y2="445" stroke="#334155" stroke-width="3"/><line x1="380" y1="445" x2="780" y2="445" stroke="#334155" stroke-width="3"/><line x1="180" y1="430" x2="180" y2="460" stroke="#334155" stroke-width="3"/><line x1="