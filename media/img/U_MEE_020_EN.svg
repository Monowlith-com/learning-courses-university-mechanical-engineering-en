<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Metals and heat treatment</title><desc id="desc">Schematic temperature history of steel quenching and tempering.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Metals and heat treatment</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><line x1="110" y1="480" x2="890" y2="480" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="110" y1="480" x2="110" y2="130" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="885" y="515" font-size="22" fill="#172b3b" text-anchor="end">Time</text><text x="122" y="142" font-size="22" fill="#172b3b" text-anchor="start">Temperature</text><polyline points="110,460 260,180 420,180 455,460 550,460 620,330 740,330 850,460" fill="none" stroke="#116b91" stroke-width="4"/><text x="340" y="150" font-size="24" fill="#172b3b" text-anchor="middle">Austenitise</text><text x="435" y="275" font-size="23" fill="#ad472f" text-anchor="start">Quench</text><text x="680" y="300" font-size="24" fill="#172b3b" text-anchor="middle">Temper</text><text x="490" y="555" font-size="24" fill="#172b3b" text-anchor="middle">Schematic, not a process specification</text></g></svg>
