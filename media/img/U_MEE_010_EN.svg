<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Stress, strain and tension</title><desc id="desc">Tension bar with forces, cross-sectional area, gauge length and calculated elongation.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Stress, strain and tension</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="210" y="180" width="540" height="100" fill="#eef2f5" stroke="#334155" stroke-width="2"/><line x1="210" y1="230" x2="110" y2="230" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><line x1="750" y1="230" x2="850" y2="230" stroke="#ad472f" stroke-width="4" marker-end="url(#arr)"/><text x="100" y="200" font-size="26" fill="#ad472f" text-anchor="start">F</text><text x="850" y="200" font-size="26" fill="#ad472f" text-anchor="start">F</text><line x1="210" y1="320" x2="750" y2="320" stroke="#334155" stroke-width="3"/><line x1="210" y1="305" x2="210" y2="335" stroke="#334155" stroke-width="3"/><line x1="750" y1="305" x2="750" y2="335" stroke="#334155" stroke-width="3"/><text x="480" y="355" font-size="26" fill="#172b3b" text-anchor="middle">L = 500 mm</text><text x="480" y="240" font-size="29" fill="#172b3b" text-anchor="middle">A = 100 mm²</text><text x="480" y="425" font-size="29" fill="#172b3b" text-anchor="middle">σ = F/A = 100 MPa</text><text x="480" y="475" font-size="29" fill="#172b3b" text-anchor="middle">ε = σ/E = 0.0005</text><text x="480" y="525" font-size="29" fill="#116b91" text-anchor="middle">ΔL = 0.25 mm</text></g></svg>
