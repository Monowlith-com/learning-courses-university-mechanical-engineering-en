<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Linear systems and matrices</title><desc id="desc">Two linear equations and their common intersection.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Linear systems and matrices</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><text x="80" y="150" font-size="32" fill="#172b3b" text-anchor="start">2x + y = 10</text><text x="80" y="205" font-size="32" fill="#172b3b" text-anchor="start">x + 2y = 8</text><text x="80" y="280" font-size="25" fill="#172b3b" text-anchor="start">Elimination</text><text x="80" y="330" font-size="32" fill="#172b3b" text-anchor="start">3y = 6</text><text x="80" y="390" font-size="32" fill="#116b91" text-anchor="start">y = 2, x = 4</text><line x1="500" y1="480" x2="865" y2="480" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="500" y1="480" x2="500" y2="125" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><text x="860" y="515" font-size="22" fill="#172b3b" text-anchor="end">x</text><text x="512" y="137" font-size="22" fill="#172b3b" text-anchor="start">y</text><polyline points="500,180 750,480" fill="none" stroke="#116b91" stroke-width="4"/><polyline points="500,360 850,465.0" fill="none" stroke="#ad472f" stroke-width="4"/><circle cx="700" cy="420" r="8" fill="#116b91"/><text x="710" y="410" font-size="25" fill="#172b3b" text-anchor="start">(4, 2)</text><text x="690" y="175" font-size="22" fill="#116b91" text-anchor="start">2x + y = 10</text><text x="690" y="208" font-size="22" fill="#ad472f" text-anchor="start">x + 2y = 8</text></g></svg>
