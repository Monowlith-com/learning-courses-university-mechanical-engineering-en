<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Conduction, convection and radiation</title><desc id="desc">Conduction through a wall and convection at both surfaces.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Conduction, convection and radiation</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="370" y="150" width="220" height="310" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="480" y="195" font-size="26" fill="#172b3b" text-anchor="middle">Insulation</text><text x="175" y="245" font-size="30" fill="#ad472f" text-anchor="middle">Inside</text><text x="785" y="245" font-size="30" fill="#116b91" text-anchor="middle">Outside</text><line x1="100" y1="300" x2="860" y2="300" stroke="#ad472f" stroke-width="5" marker-end="url(#arr)"/><text x="480" y="285" font-size="27" fill="#ad472f" text-anchor="middle">Q̇ = 15.09 W</text><text x="245" y="400" font-size="24" fill="#172b3b" text-anchor="middle">Rconv,i</text><text x="480" y="400" font-size="24" fill="#172b3b" text-anchor="middle">Rcond</text><text x="715" y="400" font-size="24" fill="#172b3b" text-anchor="middle">Rconv,o</text><text x="480" y="530" font-size="27" fill="#172b3b" text-anchor="middle">Rtotal = 1.325 K/W</text></g></svg>
