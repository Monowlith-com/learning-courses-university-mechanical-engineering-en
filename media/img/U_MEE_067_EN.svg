<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Systematic product development and reliability</title><desc id="desc">Three independent functions in a logical series configuration.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="31" fill="#172b3b" text-anchor="start">Systematic product development and reliability</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="85" y="225" width="190" height="130" fill="#dbeaf1" stroke="#334155" stroke-width="2"/><text x="180" y="270" font-size="25" fill="#172b3b" text-anchor="middle">Function 1</text><text x="180" y="320" font-size="28" fill="#172b3b" text-anchor="middle">R = 0.99</text><line x1="275" y1="290" x2="385" y2="290" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><rect x="385" y="225" width="190" height="130" fill="#dbeaf1" stroke="#334155" stroke-width="2"/><text x="480" y="270" font-size="25" fill="#172b3b" text-anchor="middle">Function 2</text><text x="480" y="320" font-size="28" fill="#172b3b" text-anchor="middle">R = 0.98</text><line x1="575" y1="290" x2="685" y2="290" stroke="#116b91" stroke-width="4" marker-end="url(#arr)"/><rect x="685" y="225" width="190" height="130" fill="#dbeaf1" stroke="#334155" stroke-width="2"/><text x="780" y="270" font-size="25" fill="#172b3b" text-anchor="middle">Function 3</text><text x="780" y="320" font-size="28" fill="#172b3b" text-anchor="middle">R = 0.97</text><text x="480" y="180" font-size="28" fill="#172b3b" text-anchor="middle">All three required</text><text x="480" y="450" font-size="29" fill="#172b3b" text-anchor="middle">RS = 0.99 × 0.98 × 0.97</text><text x="480" y="510" font-size="32" fill="#116b91" text-anchor="middle">RS = 0.941094</text></g></svg>
